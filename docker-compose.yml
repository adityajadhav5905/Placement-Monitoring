version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: placement_monitoring_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_db_password
      MYSQL_DATABASE: placement_monitoring
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_db_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement_monitoring_backend
    restart: always
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root_db_password
      DATABASE_NAME: placement_monitoring
      API_KEY: fca62d64a27546855b39922e967a1fb53086eb293c66f7f6a7cd67f8976a4dfc
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placement_monitoring_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
